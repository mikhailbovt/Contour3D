name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-checks:
    name: Host checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Host tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate and build plugin
        run: python tools/package_plugin.py --output-dir dist
